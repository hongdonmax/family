<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 아이 칭찬 스티커판</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 상단: 아이 선택 -->
    <header class="topbar">
      <div class="brand">⭐ 칭찬 스티커판</div>
      <div class="kid-tabs">
        <button class="kid-tab" data-kid="yuni">유니 (다윤)</button>
        <button class="kid-tab" data-kid="rini">리니 (세린)</button>
      </div>
    </header>

    <!-- 제목 -->
    <h1 id="boardTitle" class="board-title">유니의 칭찬스티커판</h1>

    <!-- 진행 요약 -->
    <section class="summary">
      <div class="summary-card stamps">
        <div class="summary-num" id="stampCount">0</div>
        <div class="summary-label">모은 도장</div>
      </div>
      <div class="summary-card goal">
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="summary-label">
          <span id="goalText">동물 스티커까지 10개 남았어요!</span>
        </div>
      </div>
      <div class="summary-card animals">
        <div class="summary-num" id="animalCount">0</div>
        <div class="summary-label">받은 동물 스티커</div>
      </div>
    </section>

    <!-- 칭찬 항목 버튼 -->
    <section class="panel">
      <h2 class="panel-title">👏 칭찬 도장 주기</h2>
      <p class="panel-help">잘한 일을 누르면 도장을 하나 받아요. 실수로 눌렀다면 길게(오른쪽 버튼) 눌러 한 개 빼기.</p>
      <div class="task-grid" id="taskGrid"><!-- JS로 채움 --></div>
    </section>

    <!-- 도장판 -->
    <section class="panel">
      <h2 class="panel-title">🏅 도장판 <span class="muted" id="boardSubtitle"></span></h2>
      <div class="stamp-board" id="stampBoard"><!-- JS로 채움 --></div>
    </section>

    <!-- 동물 스티커 모음 -->
    <section class="panel">
      <h2 class="panel-title">🦁 받은 동물 스티커</h2>
      <p class="panel-help">도장 <span id="perAnimal">10</span>개를 모으면 동물 스티커를 한 개 받아요!</p>
      <div class="animal-shelf" id="animalShelf"><!-- JS로 채움 --></div>
    </section>

    <!-- 최근 기록 -->
    <section class="panel">
      <h2 class="panel-title">📜 최근 기록</h2>
      <ul class="history" id="history"><!-- JS로 채움 --></ul>
    </section>

    <!-- 설정 / 관리 -->
    <section class="panel settings">
      <h2 class="panel-title">⚙️ 부모님 설정</h2>
      <div class="settings-row">
        <label>동물 스티커 1개에 필요한 도장 수
          <input type="number" id="perAnimalInput" min="1" max="50" />
        </label>
        <button class="btn" id="saveSettings">저장</button>
      </div>
      <div class="settings-row">
        <button class="btn danger" id="resetKid">이 아이 도장 초기화</button>
        <span class="muted">동물 스티커는 그대로 유지돼요.</span>
      </div>
    </section>

    <footer class="footer">
      만든 사람: 엄마 · 아빠 ❤️ — 데이터는 이 기기에 자동 저장돼요.
    </footer>
  </div>

  <!-- 칭찬 축하 팝업 -->
  <div class="celebrate" id="celebrate" hidden>
    <div class="celebrate-box">
      <div class="celebrate-emoji" id="celebrateEmoji">🎉</div>
      <div class="celebrate-text" id="celebrateText">참 잘했어요!</div>
      <button class="btn big" id="celebrateClose">좋아요!</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
